<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">How a recording travels</title>
  <desc id="desc">The watch records Opus audio, the Zepp app on the phone receives it over Bluetooth and wraps it as Ogg, a Google Apps Script in your account saves it to Google Drive under Recorder/2026/10/07/. A file stays on the watch until Drive confirms it.</desc>
  <rect width="1200" height="340" rx="28" fill="#0e0f11"/>
  <g>
    <circle cx="138" cy="104" r="38" fill="#000" stroke="#8e8e93" stroke-width="3"/>
    <rect x="175" y="88" width="9" height="20" rx="3" fill="#8e8e93"/>
    <circle cx="138" cy="104" r="10" fill="#ff3b30"/>
    <text x="138" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f2f2f7" text-anchor="middle">Watch</text>
    <text x="138" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">records Opus,</text>
    <text x="138" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">16 kHz mono</text>
  </g>
  <path d="M228 104 H298" stroke="#5f636b" stroke-width="2.5" fill="none"/>
    <path d="M288 96 L300 104 L288 112" stroke="#5f636b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="368" y="64" width="48" height="80" rx="10" fill="none" stroke="#8e8e93" stroke-width="3"/>
    <rect x="384" y="132" width="16" height="3" rx="1.5" fill="#8e8e93"/>
    <text x="392" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f2f2f7" text-anchor="middle">Zepp app</text>
    <text x="392" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">gets it over Bluetooth,</text>
    <text x="392" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">wraps it as Ogg</text>
  </g>
  <path d="M484 104 H554" stroke="#5f636b" stroke-width="2.5" fill="none"/>
    <path d="M544 96 L556 104 L544 112" stroke="#5f636b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <path d="M618 66 h34 l16 16 v60 h-50 z" fill="none" stroke="#8e8e93" stroke-width="3" stroke-linejoin="round"/>
    <text x="643" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#8e8e93" text-anchor="middle">{ }</text>
    <text x="643" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f2f2f7" text-anchor="middle">Apps Script</text>
    <text x="643" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">in your Google</text>
    <text x="643" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">account, via HTTPS</text>
  </g>
  <path d="M732 104 H798" stroke="#5f636b" stroke-width="2.5" fill="none"/>
    <path d="M788 96 L800 104 L788 112" stroke="#5f636b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="806" y="42" width="346" height="238" rx="20" fill="#15171a" stroke="#26282d" stroke-width="2"/>
    <path d="M832 78 h18 l6 7 h26 v22 h-50 z" fill="none" stroke="#8e8e93" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="896" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#f2f2f7" text-anchor="start">Google Drive</text>
    <text x="832" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#c7c7cc" text-anchor="start">Recorder/</text>
    <text x="846" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#c7c7cc" text-anchor="start">└ 2026/10/07/</text>
    <text x="866" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8e8e93" text-anchor="start">├ 2026-10-07_18-02-11.ogg</text>
    <text x="866" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#f2f2f7" text-anchor="start">└ 2026-10-07_23-14-02.ogg</text>
  </g>
  <circle cx="72" cy="307" r="7" fill="#ff3b30"/>
  <text x="90" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="start">Until Drive confirms a file, it stays on the watch and waits in Records.</text>
</svg>
