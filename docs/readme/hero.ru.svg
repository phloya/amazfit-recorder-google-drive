<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Recorder · Интеграция с Google Drive</title>
  <desc id="desc">Название и часы Amazfit Balance 2 с экраном записи: время 23:14, красная точка, ЗАПИСЬ, таймер 12:48 и подсказка нажать кнопку три раза для остановки.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#0e0f11"/>
  <g id="title-block">
    <text x="64" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="start" letter-spacing="1.5">ZEPP OS · AMAZFIT BALANCE 2</text>
    <text x="64" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#f2f2f7" text-anchor="start">Amazfit Recorder</text>
    <rect x="64" y="176" width="373" height="40" rx="20" fill="none" stroke="#5f636b" stroke-width="2"/>
    <path d="M84 189 h10 l4 4 h14 v13 h-28 z" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linejoin="round"/>
    <text x="124" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f2f2f7" text-anchor="start">Интеграция с Google Drive</text>
    <text x="64" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#c7c7cc" text-anchor="start">Одна кнопка на запястье.</text>
    <text x="64" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#c7c7cc" text-anchor="start">Каждая запись — в Google Drive,</text>
    <text x="64" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#c7c7cc" text-anchor="start">в папку по дням.</text>
    <circle cx="72" cy="381" r="7" fill="#ff3b30"/>
    <text x="90" y="387" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8e8e93" text-anchor="start">Opus 16 кГц → Bluetooth → Apps Script → Drive</text>
  </g>
  <g id="watch" clip-path="url(#card)">
    <rect x="830.8" y="-368" width="198.4" height="400" rx="26" fill="#17181b"/>
    <rect x="830.8" y="392" width="198.4" height="400" rx="26" fill="#17181b"/>
    <rect x="1104" y="140" width="20" height="46" rx="7" fill="#3a3d42"/>
    <rect x="1104" y="242" width="16" height="36" rx="6" fill="#3a3d42"/>
    <circle cx="930" cy="212" r="180" fill="#232529"/>
    <circle cx="930" cy="212" r="167" fill="none" stroke="#3a3d42" stroke-width="3"/>
    <circle cx="930" cy="212" r="160" fill="#000"/>
    <text x="930" y="100.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22.7" font-weight="400" fill="#c7c7cc" text-anchor="middle">23:14</text>
    <circle cx="930" cy="128.7" r="10.7" fill="#ff3b30"/>
    <text x="930" y="171.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#8e8e93" text-anchor="middle">ЗАПИСЬ</text>
    <text x="930" y="226.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50.7" font-weight="400" fill="#f2f2f7" text-anchor="middle">12:48</text>
    <text x="930" y="304.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8e8e93" text-anchor="middle">кнопка 3 раза — стоп</text>
